<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Крошка — пекарня</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            <img src="images/logo.png" alt="Крошка">
        </div>

        <div class="search">
            <img src="images/search.svg" alt="Поиск" width="20">
            <input type="text" placeholder="Поиск товаров...">
        </div>

               <div class="header-icons">
            <img src="images/profile.svg" alt="Профиль" class="icon">
            <div class="cart">
                <img src="images/cart.svg" alt="Корзина" class="icon">
                <span class="cart-count">0</span>
            </div>
        </div>
    </header>
    <nav class="nav">
        <a href="#" class="nav-btn active">Ассортимент</a>
        <a href="#" class="nav-btn">Акции</a>
        <a href="#" class="nav-btn">Доставка</a>
        <a href="#" class="nav-btn">Обратная связь</a>
    </nav>
    <section class="hero">
        <div class="hero-text">
            <p class="hero-label">ВСТРЕЧАЙТЕ</p>
            <h1>Новое меню осени</h1>
            <p class="hero-desc">Свежие вкусы, уютные сочетания, которые согревают</p>
            <a href="#" class="hero-btn">Перейти к меню →</a>
        </div>
        <div class="hero-image">
            <img src="images/croissant1.jpg" alt="Круассаны" class="slide slide1">
            <img src="images/croissant2.jpg" alt="Круассаны" class="slide slide2">
            <img src="images/croissant3.jpg" alt="Круассаны" class="slide slide3">
        </div>
    </section>

</body>
</html>
