<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Крошка — пекарня</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            <img src="images/logo.png" alt="Крошка">
        </div>

        <div class="search">
            <img src="images/search.svg" alt="Поиск" width="20">
            <input type="text" placeholder="Поиск товаров...">
        </div>

               <div class="header-icons">
            <img src="images/profile.svg" alt="Профиль" class="icon">
            <div class="cart">
                <img src="images/cart.svg" alt="Корзина" class="icon">
                <span class="cart-count">0</span>
            </div>
        </div>
    </header>

</body>
</html>
